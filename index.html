<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="parent col">
        <div class="row">
            <h1>COUNTER</h1>
        </div>
        <div class="row">
            <span id="number">0</span>
        </div>
        <div class="row">
            <button onclick="increment(this)" class="plus fw-bold">+</button>
            <button onclick="decrement(this)" class="minus fw-bold">-</button> <br>
        </div>
        <div class="row">
            <button class="reset" onclick="resetNumber(0)"><i class="fa-solid fa-rotate fa-spin-snap resetI"></i></button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
